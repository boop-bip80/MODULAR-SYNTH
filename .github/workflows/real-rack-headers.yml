name: Real Rack header compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'plugins/ModularSynth/src/**'
      - 'src/Rack'
      - 'dpf'
      - 'tools/ci/check_real_rack_headers.py'
      - '.github/workflows/real-rack-headers.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/ModularSynth/src/**'
      - 'src/Rack'
      - 'dpf'
      - 'tools/ci/check_real_rack_headers.py'
      - '.github/workflows/real-rack-headers.yml'

permissions:
  contents: read

concurrency:
  group: real-rack-headers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-header-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Pin stays in the Rack Gitlink; bypass occasional GitLab SpeexDSP 502s
      # using the official Xiph mirror that contains the identical commit.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: url.https://github.com/xiph/speexdsp.git.insteadOf
      GIT_CONFIG_VALUE_0: https://gitlab.xiph.org/xiph/speexdsp.git
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Install Jansson development headers
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libjansson-dev

      - name: Fetch only necessary pinned Rack and DPF Gitlinks
        run: |
          git submodule update --init --depth 1 src/Rack dpf
          git -C src/Rack submodule update --init --depth 1 dep/glfw dep/nanosvg dep/oui-blendish dep/pffft dep/simde dep/speexdsp

      - name: Verify pinned dependencies and syntax-check eight real wrappers
        run: python3 -B tools/ci/check_real_rack_headers.py

      - name: Compile and link eight original HEADLESS wrappers
        run: python3 -B tools/ci/check_real_rack_headers.py --link-smoke
