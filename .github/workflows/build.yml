  source-tarball:
    # Release uploads need write access; all other jobs stay read-only.
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Verify SpeexDSP Git mirror before recursive checkout
        shell: bash
        run: |
          resolved="$(git ls-remote --get-url https://gitlab.xiph.org/xiph/speexdsp.git)"
          if [ "$resolved" != "https://github.com/xiph/speexdsp.git" ]; then
            echo "Expected official Xiph GitHub mirror, got: $resolved" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Complete pinned recursive submodule checkout (retry)
        shell: bash
        run: bash tools/ci/update_pinned_submodules.sh
      - name: Set up dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq liblo-dev
          sudo apt-get clean
      - name: Create source tarball
        run: |
          make HEADLESS=true tarball
          make HEADLESS=true tarball+deps
      - name: Verify source release archives
        shell: bash
        run: |
          # 'make version' evaluates the host OpenGL prerequisite even though
          # the source archives have no OpenGL dependency.
          source_version="$(awk '$1 == "VERSION" && $2 == "=" { print $3; exit }' Makefile)"
          if [[ ! "$source_version" =~ ^[0-9]+([.][0-9]+)*$ ]]; then
            echo "Invalid VERSION assignment in Makefile: '$source_version'" >&2
            exit 1
          fi
          bash .github/workflows/scripts/verify-source-tarballs.sh "$source_version"
      - name: Set sha8 (non-release)
        if: startsWith(github.ref, 'refs/tags/') != true
        run: echo "SHA8=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_ENV
      - name: Set sha8 (release)
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "SHA8=$(echo ${{ github.ref_name }})" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-source-${{ github.event.pull_request.number || env.SHA8 }}
          path: |
            /home/runner/cardinal*.tar.xz
            /home/runner/*/cardinal*.tar.xz
            /home/runner/*/*/cardinal*.tar.xz
          if-no-files-found: ${{ startsWith(github.ref, 'refs/tags/') && 'error' || 'warn' }}
      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          # Both archives are created in the checkout's parent directory.
          # Use one pattern: fail_on_unmatched_files checks each pattern.
          files: |
            ../cardinal*.tar.xz

  plugin-validation:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read  # download independent real-host recordings from an earlier run
    steps:
      - name: Verify SpeexDSP Git mirror before recursive checkout
        shell: bash
        run: |
          resolved="$(git ls-remote --get-url https://gitlab.xiph.org/xiph/speexdsp.git)"
          if [ "$resolved" != "https://github.com/xiph/speexdsp.git" ]; then
            echo "Expected official Xiph GitHub mirror, got: $resolved" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Complete pinned recursive submodule checkout (retry)
        shell: bash
        run: bash tools/ci/update_pinned_submodules.sh
      - name: Set up cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            src/Rack/dep/bin
            src/Rack/dep/include
            src/Rack/dep/lib
            src/Rack/dep/share
            src/Rack/dep/jansson-2.12
            src/Rack/dep/libarchive-3.4.3
            src/Rack/dep/libsamplerate-0.1.9
            src/Rack/dep/zstd-1.4.5
          key: pluginval-v${{ env.CACHE_VERSION }}
      - name: Set up dependencies
        run: |
          # custom repos
          wget https://launchpad.net/~kxstudio-debian/+archive/kxstudio/+files/kxstudio-repos_11.2.0_all.deb
          sudo dpkg -i kxstudio-repos_11.2.0_all.deb
          sudo apt-get update -qq
          # build-deps
          sudo apt-get install -yqq libdbus-1-dev libgl1-mesa-dev liblo-dev libx11-dev libxcursor-dev libxext-dev libxrandr-dev
          # runtime testing
          sudo apt-get install -yqq carla-git lilv-utils lv2-dev lv2lint kxstudio-lv2-extensions mod-lv2-extensions valgrind xvfb
          sudo apt-get clean
      # multiple jobs for building carla, deps and plugins
      - name: Build Cardinal (carla, deps and plugins)
        env:
          CFLAGS: -g
          CXXFLAGS: -g -DDPF_ABORT_ON_ERROR -DDPF_RUNTIME_TESTING -Wno-pmf-conversions
          LDFLAGS: -static-libgcc -static-libstdc++
        run: |
          make features
          make CIBUILD=false NOOPT=true SKIP_STRIPPING=true carla deps dgl plugins resources -j $(nproc)
      # single job for final build stage, otherwise we might get killed due to OOM
      - name: Build Cardinal (final build stage)
        env:
          CFLAGS: -g
          CXXFLAGS: -g -DDPF_ABORT_ON_ERROR -DDPF_RUNTIME_TESTING -Wno-pmf-conversions
          LDFLAGS: -static-libgcc -static-libstdc++
        run: |
          make features
          make CIBUILD=false NOOPT=true SKIP_STRIPPING=true -j 1 -C src jack
          make CIBUILD=false NOOPT=true -j 1
          ./dpf/utils/generate-ttl.sh
      - name: Run Cardinal self-tests
        shell: bash
        run: |
          set -euo pipefail
          # --exit-on-first-error=yes
          xvfb-run valgrind \
                --gen-suppressions=all \
                --error-exitcode=255 \
                --leak-check=no \
                --track-origins=yes \
                --keep-debuginfo=yes \
                --suppressions=./dpf/utils/valgrind-dpf.supp \
                ./bin/Cardinal selftest 2>&1 | tee "$RUNNER_TEMP/cardinal-selftest.log"
      - name: Verify first-party runtime selftest inventory
        id: first_party_inventory
        run: |
          # A successful Cardinal selftest builds a real module+widget and
          # inserts each registered model into its engine. NUL-terminated
          # identifiers in ELF .rodata are not reliable proof of registration:
          # short std::string slugs and RTTI pooling can evade the string scan.
          python3 -B tools/ci/verify_first_party_selftest.py \
            --selftest-log "$RUNNER_TEMP/cardinal-selftest.log"
      - name: Diagnose linked ELF collection on runtime inventory failure
        if: failure() && steps.first_party_inventory.outcome == 'failure'
        run: |
          # Diagnostic context only; ELF string placement is not a hard gate.
          python3 -B tools/ci/diagnose_compiled_collection.py \
            --binary bin/CardinalSynth.lv2/CardinalSynth.so \
            --candidate bin/CardinalFX.lv2/CardinalFX.so \
            --candidate bin/Cardinal.lv2/Cardinal.so \
            --candidate bin/Cardinal \
            --json-output first-party-linked-elf-diagnostics.json
      - name: Upload linked ELF collection diagnostics
        if: failure() && steps.first_party_inventory.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: first-party-linked-elf-diagnostics
          path: first-party-linked-elf-diagnostics.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate LV2 ttl syntax
        run: |
          lv2_validate \
              /usr/lib/lv2/kx-meta/*.ttl \
              /usr/lib/lv2/kx-control-input-port-change-request.lv2/*.ttl \
              /usr/lib/lv2/kx-programs.lv2/*.ttl \
              /usr/lib/lv2/mod.lv2/*.ttl \
              /usr/lib/lv2/modgui.lv2/*.ttl \
              ./bin/*.lv2/*.ttl
      - name: Validate LV2 metadata and binaries
        run: |
          export LV2_PATH=/tmp/lv2-path
          mkdir ${LV2_PATH}
          mv bin/CardinalFX.lv2 bin/CardinalSynth.lv2 ${LV2_PATH}
          cp -r /usr/lib/lv2/{atom,buf-size,core,data-access,kx-control-input-port-change-request,kx-programs,instance-access,midi,mod,modgui,parameters,port-groups,port-props,options,patch,presets,resize-port,state,time,ui,units,urid,worker}.lv2 ${LV2_PATH}
          xvfb-run lv2lint -s lv2_generate_ttl -l ld-linux-x86-64.so.2 -M nopack $(lv2ls)
      - name: Verify all plugin host-bridge targets exist
        run: python3 -B tools/ci/verify_plugin_bridge_inventory.py --bin-dir bin --lv2-dir /tmp/lv2-path
      - name: Test LV2 plugin
        run: |
          set -euo pipefail
          export LV2_PATH=/tmp/lv2-path
          for uri in \
              "https://distrho.kx.studio/plugins/cardinal#fx" \
              "https://distrho.kx.studio/plugins/cardinal#synth"; do
            lv2ls | grep -Fx -- "$uri" > /dev/null
            env CARLA_BRIDGE_DUMMY=1 CARLA_BRIDGE_TESTING=native \
                xvfb-run valgrind \
                --error-exitcode=255 \
                --leak-check=no \
                --track-origins=yes \
                --keep-debuginfo=yes \
                --suppressions=./dpf/utils/valgrind-dpf.supp \
                /usr/lib/carla/carla-bridge-native lv2 "" "$uri"
          done
      - name: Test VST2 plugin
        run: |
          set -euo pipefail
          for variant in CardinalFX CardinalSynth; do
            p="./bin/Cardinal.vst/${variant}.so"
            test -s "$p"
            env CARLA_BRIDGE_DUMMY=1 CARLA_BRIDGE_TESTING=native \
                xvfb-run valgrind \
                --error-exitcode=255 \
                --leak-check=no \
                --track-origins=yes \
                --keep-debuginfo=yes \
                --suppressions=./dpf/utils/valgrind-dpf.supp \
                /usr/lib/carla/carla-bridge-native vst2 "$p" ""
          done
      - name: Test VST3 plugin
        run: |
          set -euo pipefail
          for variant in Cardinal CardinalFX CardinalSynth; do
            p="./bin/${variant}.vst3"
            test -d "$p"
            env CARLA_BRIDGE_DUMMY=1 CARLA_BRIDGE_TESTING=native \
                xvfb-run valgrind \
                --error-exitcode=255 \
                --leak-check=no \
                --track-origins=yes \
                --keep-debuginfo=yes \
                --suppressions=./dpf/utils/valgrind-dpf.supp \
                /usr/lib/carla/carla-bridge-native vst3 "$p" ""
          done
      # Carla's dummy-bridge smoke checks above exercise plugin-host entry
      # points, but DO NOT generate playable audio. Explicit operator-provided
      # actual-host recordings are an independent, opt-in manual acceptance
      # gate. Disabled builds must not be reported as passing audio validation.
      - name: Declare real-host stereo audio evidence status
        run: |
          echo 'HOST AUDIO NOT PROVEN by build or Carla dummy bridge smoke.'
          echo 'For independently collected recordings dispatch build with require_host_audio_evidence=true and a capture artifact run ID.'
      - name: Download operator-recorded real-host audio capture
        if: github.event_name == 'workflow_dispatch' && inputs.require_host_audio_evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ inputs.host_audio_capture_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$EVIDENCE_RUN_ID" =~ ^[0-9]{1,18}$ ]]; then
            echo 'Real-host capture required, but a valid artifact run ID was not supplied.' >&2
            exit 1
          fi
          mkdir -p host-evidence
          gh run download "$EVIDENCE_RUN_ID" \
            --name modular-real-host-audio \
            --dir host-evidence
          test -s host-evidence/capture.json || {
            echo 'Required real-host capture.json missing from artifact; no audio validation.' >&2
            exit 1
          }
      - name: Validate source-matched real-host stereo audio evidence
        if: github.event_name == 'workflow_dispatch' && inputs.require_host_audio_evidence
        run: |
          set -euo pipefail
          python3 -B tools/ci/verify_host_audio_capture_ci.py \
            --manifest host-evidence/capture.json \
            --expected-sha "$(git rev-parse HEAD)" \
            --bin-dir bin \
            --lv2-dir /tmp/lv2-path
