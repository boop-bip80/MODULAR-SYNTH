name: build

on:
  push:
    branches: [main]
    tags: ['**']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      require_host_audio_evidence:
        description: 'Opt in to source-matched operator-provided DAW WAV evidence (fails if absent)'
        required: false
        type: boolean
        default: false
      host_audio_capture_run_id:
        description: 'Run ID containing a modular-real-host-audio artifact captured in a real host'
        required: false
        type: string

# The large build matrix is for integration/release verification, not every
# feature-branch push and pull request. Those run quality-baseline.yml.
# Cancel obsolete main pushes but never cancel release tags or manual builds.
concurrency:
  group: build-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # Rack pins speexdsp to a GitLab commit that is also present in the official
  # Xiph GitHub mirror. Use the mirror if GitLab returns upstream 502/504.
  # Git's environment config propagates to nested recursive checkout calls.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: url.https://github.com/xiph/speexdsp.git.insteadOf
  GIT_CONFIG_VALUE_0: https://gitlab.xiph.org/xiph/speexdsp.git
  CACHE_VERSION: 15
  CARDINAL_UNDER_WINE: 1
  CIBUILD: true
  DEBIAN_FRONTEND: noninteractive
  LIBGL_ALWAYS_SOFTWARE: true
  PAWPAW_CI: 1
  PAWPAW_FAST_MATH: 1
  PAWPAW_SKIP_GLIB: 1
  PAWPAW_SKIP_LTO: 1
  PAWPAW_SKIP_LV2: 1
  PAWPAW_SKIP_OPENSSL: 1
  PAWPAW_SKIP_SAMPLERATE: 1
  PAWPAW_SKIP_TESTS: 1

jobs:
  linux:
    # Release uploads need write access; all other jobs stay read-only.
    permissions:
      contents: write
    strategy:
      matrix:
        target: [aarch64, armhf, i686, riscv64, x86_64]
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Install git
        run: |
          apt-get update -qq && apt-get install -yqq --no-install-recommends ca-certificates curl git openssl
          curl -sLO https://launchpad.net/~kxstudio-debian/+archive/ubuntu/toolchain/+files/git_2.34.1-1ubuntu1~bpo20.04.1~ppa1_amd64.deb
          curl -sLO https://launchpad.net/~kxstudio-debian/+archive/ubuntu/toolchain/+files/git-man_2.34.1-1ubuntu1~bpo20.04.1~ppa1_all.deb
          dpkg -i *.deb
          rm *.deb
      - name: Verify SpeexDSP Git mirror before recursive checkout
        shell: bash
        run: |
          resolved="$(git ls-remote --get-url https://gitlab.xiph.org/xiph/speexdsp.git)"
          if [ "$resolved" != "https://github.com/xiph/speexdsp.git" ]; then
            echo "Expected official Xiph GitHub mirror, got: $resolved" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Complete pinned recursive submodule checkout (retry)
        shell: bash
        run: bash tools/ci/update_pinned_submodules.sh
      - name: Set up build cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/PawPawBuilds
            src/Rack/dep/bin
            src/Rack/dep/include
            src/Rack/dep/lib
            src/Rack/dep/share
            src/Rack/dep/jansson-2.12
            src/Rack/dep/libarchive-3.4.3
            src/Rack/dep/libsamplerate-0.1.9
            src/Rack/dep/zstd-1.4.5
          key: linux-${{ matrix.target }}-v${{ env.CACHE_VERSION }}
      - name: Setup dependencies
        shell: bash
        run: |
          # workaround for ncurses riscv64 build failure
          if [[ "${{ matrix.target }}" = "riscv64" ]]; then
              # The runner is amd64. Register the foreign dpkg architecture
              # before installing libtinfo6:riscv64 or libsdl2-dev:riscv64.
              # Restrict the stock Ubuntu mirrors to amd64; riscv64 packages
              # are served by ports.ubuntu.com, not archive.ubuntu.com.
              dpkg --add-architecture riscv64
              sed -i -E 's|^deb (https?://)|deb [arch=amd64] \1|' /etc/apt/sources.list
              dpkg --print-foreign-architectures | grep -qx riscv64
              echo "deb [arch=riscv64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse" | tee -a /etc/apt/sources.list
              echo "deb [arch=riscv64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse" | tee -a /etc/apt/sources.list
              echo "deb [arch=riscv64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse" | tee -a /etc/apt/sources.list
              apt-get update -qq
              apt-get purge -yqq libncurses-dev
              apt-get install -yqq wget
              wget \
                  http://kx.studio/tmp/libtinfo6_6.3-2ubuntu0.1_amd64.deb \
                  http://kx.studio/tmp/libncurses6_6.3-2ubuntu0.1_amd64.deb \
                  http://kx.studio/tmp/libncursesw6_6.3-2ubuntu0.1_amd64.deb \
                  && dpkg -i *.deb && rm *.deb
              apt-get install -yqq libtinfo6:riscv64
          fi
          ./deps/PawPaw/.github/workflows/bootstrap-deps.sh linux-${{ matrix.target }}
          apt-get install -yqq wget zip
      - name: Setup dependencies (aarch64)
        if: ${{ matrix.target == 'aarch64' }}
        shell: bash
        run: |
          apt-get install -yqq libsdl2-dev:arm64
          apt-get clean
      - name: Setup dependencies (armhf)
        if: ${{ matrix.target == 'armhf' }}
        shell: bash
        run: |
          apt-get install -yqq libsdl2-dev:armhf
          apt-get clean
      - name: Setup dependencies (i686)
        if: ${{ matrix.target == 'i686' }}
        shell: bash
        run: |
          apt-get install -yqq libsdl2-dev:i386
          apt-get clean
      - name: Setup dependencies (riscv64)
        if: ${{ matrix.target == 'riscv64' }}
        shell: bash
        run: |
          apt-get install -yqq libsdl2-dev:riscv64
          apt-get clean
      - name: Setup dependencies (x86_64)
        if: ${{ matrix.target == 'x86_64' }}
        shell: bash
        run: |
          apt-get install -yqq libsdl2-dev
          apt-get clean
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-linux-${{ matrix.target }}-v${{ env.CACHE_VERSION }}
      - name: Build extra dependencies
        run: |
          bash .github/workflows/scripts/seed-pawpaw-flac.sh
          ./deps/PawPaw/bootstrap-cardinal.sh linux-${{ matrix.target }} && ./deps/PawPaw/.cleanup.sh linux-${{ matrix.target }}
      - name: Build linux
        shell: bash
        run: |
          export PATH="/usr/lib/ccache:${PATH}"
          source deps/PawPaw/local.env linux-${{ matrix.target }}
          make features
          make HAVE_PULSEAUDIO=false NOOPT=true USING_GLES2=${{ matrix.target == 'aarch64' || matrix.target == 'armhf' }} -j $(nproc)
          make unzipfx
      - name: Set sha8 (non-release)
        if: startsWith(github.ref, 'refs/tags/') != true
        run: echo "SHA8=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_ENV
      - name: Set sha8 (release)
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "SHA8=$(echo ${{ github.ref_name }})" >> $GITHUB_ENV
      - name: Pack binaries
        run: |
          tar -c -h --hard-dereference -z -f ${{ github.event.repository.name }}-linux-${{ matrix.target }}-${{ github.event.pull_request.number || env.SHA8 }}.tar.gz -C bin $(ls bin | grep -e lv2 -e vst -e clap) ../CardinalJACK ../CardinalNative ../LICENSE ../README.md ../docs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-linux-${{ matrix.target }}-${{ github.event.pull_request.number || env.SHA8 }}
          path: |
            *.tar.gz
          if-no-files-found: ${{ startsWith(github.ref, 'refs/tags/') && 'error' || 'warn' }}
      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            *.tar.gz

  linux-x86_64-debug:
    runs-on: ubuntu-22.04
    steps:
      - name: Verify SpeexDSP Git mirror before recursive checkout
        shell: bash
        run: |
          resolved="$(git ls-remote --get-url https://gitlab.xiph.org/xiph/speexdsp.git)"
          if [ "$resolved" != "https://github.com/xiph/speexdsp.git" ]; then
            echo "Expected official Xiph GitHub mirror, got: $resolved" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Complete pinned recursive submodule checkout (retry)
        shell: bash
        run: bash tools/ci/update_pinned_submodules.sh
      - name: Set up dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq libasound2-dev libdbus-1-dev libgl1-mesa-dev liblo-dev libsdl2-dev libx11-dev libxcursor-dev libxext-dev libxrandr-dev gperf meson
          sudo apt-get clean
      - name: Build linux x86_64 (debug)
        env:
          LDFLAGS: -static-libgcc -static-libstdc++
        run: |
          make features
          # multiple jobs for building carla, deps and plugins
          make DEBUG=true carla deps dgl plugins resources -j $(nproc)
          # single job for final build stage, otherwise we might get killed due to OOM
          make DEBUG=true HAVE_PULSEAUDIO=false jack -j 1
      - name: Set sha8
        id: slug
        run: echo "SHA8=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_ENV
      - name: Pack binaries
        run: |
          tar -c -h --hard-dereference -J -f ${{ github.event.repository.name }}-linux-x86_64-debug-${{ github.event.pull_request.number || env.SHA8 }}.tar.xz -C bin $(ls bin | grep -e lv2 -e vst -e clap) ../LICENSE ../README.md ../docs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-linux-x86_64-debug-${{ github.event.pull_request.number || env.SHA8 }}
          path: |
            *.tar.xz

  macos:
    # Release uploads need write access; all other jobs stay read-only.
    permissions:
      contents: write
    # GitHub Actions retired macOS 14 on 2026-11-02:
    # https://github.com/actions/runner-images/issues/13518
    # Use an explicitly Intel host for PawPaw's x86_64-hosted universal build;
    # the unsuffixed macos-15 runner label selects Apple Silicon in 2026.
    runs-on: macos-15-intel
    steps:
      - name: Verify available Intel macOS build host
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = x86_64
          sw_vers -productVersion
          xcodebuild -version
      - name: Verify SpeexDSP Git mirror before recursive checkout
        shell: bash
        run: |
          resolved="$(git ls-remote --get-url https://gitlab.xiph.org/xiph/speexdsp.git)"
          if [ "$resolved" != "https://github.com/xiph/speexdsp.git" ]; then
            echo "Expected official Xiph GitHub mirror, got: $resolved" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Complete pinned recursive submodule checkout (retry)
        shell: bash
        run: bash tools/ci/update_pinned_submodules.sh
      - name: Set up cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/PawPawBuilds
            src/Rack/dep/bin
            src/Rack/dep/include
            src/Rack/dep/lib
            src/Rack/dep/share
            src/Rack/dep/jansson-2.12
            src/Rack/dep/libarchive-3.4.3
            src/Rack/dep/libsamplerate-0.1.9
            src/Rack/dep/zstd-1.4.5
          key: macos-universal-v${{ env.CACHE_VERSION }}
      - name: Setup dependencies
        run: |
          brew uninstall --force --ignore-dependencies cmake
          ./deps/PawPaw/.github/workflows/bootstrap-deps.sh macos-universal-10.15
      - name: Build extra dependencies
        run: |
          export PATH="/usr/local/opt/ccache/libexec:${PATH}"
          bash .github/workflows/scripts/seed-pawpaw-flac.sh
          ./deps/PawPaw/bootstrap-cardinal.sh macos-universal-10.15 && ./deps/PawPaw/.cleanup.sh macos-universal-10.15
      - name: Set up ccache
        if: steps.cache.outputs.cache-hit == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-macos-universal-v${{ env.CACHE_VERSION }}
      - name: Build macOS (base)
        shell: bash
        run: |
          export PATH="/usr/local/opt/ccache/libexec:${PATH}"
          source deps/PawPaw/local.env macos-universal-10.15
          make features
          make NOOPT=true ${MAKE_ARGS} -j $(sysctl -n hw.logicalcpu)
      - name: Verify universal macOS build products
        run: python3 -B .github/workflows/scripts/verify-macos-release-payload.py --binaries bin
      - name: Verify macOS installer inputs without modifying bundles
        shell: bash
        run: bash utils/create-macos-installer.sh --preflight
      - name: Build macOS (packaging)
        shell: bash
        env:
          MACOS_APP_CERTIFICATE: ${{ secrets.MACOS_APP_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARIZATION_USER: ${{ secrets.MACOS_NOTARIZATION_USER }}
          MACOS_NOTARIZATION_PASS: ${{ secrets.MACOS_NOTARIZATION_PASS }}
          MACOS_NOTARIZATION_TEAM: ${{ secrets.MACOS_NOTARIZATION_TEAM }}
        run: |
          source deps/PawPaw/local.env macos-universal-10.15
          ./utils/create-macos-installer.sh
      - name: Set sha8 (non-release)
        if: startsWith(github.ref, 'refs/tags/') != true
        run: echo "SHA8=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_ENV
      - name: Set sha8 (release)
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "SHA8=$(echo ${{ github.ref_name }})" >> $GITHUB_ENV
      - name: Rename macOS bundle
        run: |
          # The inherited installer script emits Cardinal-macOS.pkg, not the fork name.
          test -s Cardinal-macOS.pkg
          mv Cardinal-macOS.pkg ${{ github.event.repository.name }}-macOS-universal-${{ github.event.pull_request.number || env.SHA8 }}.pkg
      - name: Verify macOS installer XAR and component inventory
        run: |
          python3 -B .github/workflows/scripts/verify-macos-release-payload.py \
            --package "${{ github.event.repository.name }}-macOS-universal-${{ github.event.pull_request.number || env.SHA8 }}.pkg" \
            --expected-name "${{ github.event.repository.name }}-macOS-universal-${{ github.event.pull_request.number || env.SHA8 }}.pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-macOS-universal-${{ github.event.pull_request.number || env.SHA8 }}
          path: |
            ${{ github.event.repository.name }}-*.pkg
          # Cold-cache builds must also package; tags fail on missing assets.
          if-no-files-found: ${{ startsWith(github.ref, 'refs/tags/') && 'error' || 'warn' }}
      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ github.event.repository.name }}-*.pkg

  mod-plugin-builder:
    strategy:
      matrix:
        include:
          - name: darkglass-anagram
            target: darkglass-anagram
          - name: modduo
            target: modduo-static
            extraflags: MODDUO=true
          - name: modduox
            target: modduox-static
          - name: moddwarf
            target: moddwarf
    runs-on: ubuntu-22.04
    steps:
      - name: Verify SpeexDSP Git mirror before recursive checkout
        shell: bash
        run: |
          resolved="$(git ls-remote --get-url https://gitlab.xiph.org/xiph/speexdsp.git)"
          if [ "$resolved" != "https://github.com/xiph/speexdsp.git" ]; then
            echo "Expected official Xiph GitHub mirror, got: $resolved" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Complete pinned recursive submodule checkout (retry)
        shell: bash
        run: bash tools/ci/update_pinned_submodules.sh
      - name: Set up cache
        uses: actions/cache@v4
        id: mpb-cache
        with:
          path: |
            ~/mod-workdir
          key: ${{ matrix.target }}-v${{ env.CACHE_VERSION }}
      - name: Set up dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq acl bc curl cvs git mercurial rsync subversion wget bison bzip2 flex gawk gperf gzip help2man nano perl patch tar texinfo unzip automake binutils build-essential cpio libtool libncurses-dev pkg-config python3 libtool-bin liblo-dev qemu-user-static
          sudo apt-get install -yqq pandoc texlive-latex-recommended texlive-latex-extra
          sudo apt-get clean
      - name: Bootstrap toolchain
        id: mpb_bootstrap
        if: steps.mpb-cache.outputs.cache-hit != 'true'
        env:
          MOD_LINARO_SOURCE_URL: ${{ vars.MOD_LINARO_SOURCE_URL }}
          MOD_LINARO_SOURCE_SHA256: ${{ vars.MOD_LINARO_SOURCE_SHA256 }}
        run: |
          git clone --depth=1 https://github.com/moddevices/mod-plugin-builder.git deps/mod-plugin-builder
          sed -i "s/CT_LOG_PROGRESS_BAR=y/CT_LOG_PROGRESS_BAR=n/" deps/mod-plugin-builder/toolchain/*.config
          # Legacy source URLs now redirect to HTML. Crosstool-NG does not have
          # a pinned digest for GCC Linaro 7.5 and otherwise extracts that HTML.
          # The builder's .common uses ~/mod-workdir/download as its local cache.
          python3 tools/ci/seed_mod_toolchain_source.py
          $(pwd)/deps/mod-plugin-builder/bootstrap.sh ${{ matrix.target }} minimal && $(pwd)/deps/mod-plugin-builder/.clean-install.sh ${{ matrix.target }}
      - name: Diagnose failed toolchain bootstrap
        if: ${{ failure() && steps.mpb_bootstrap.outcome == 'failure' }}
        shell: bash
        run: |
          # Diagnostics only. Never suppress the original bootstrap failure.
          # Limit discovery to the MOD toolchain's working directories.
          diagnostic_roots=()
          for root in "$HOME/mod-workdir" "$GITHUB_WORKSPACE/deps/mod-plugin-builder"; do
            if [[ -d "$root" ]]; then
              diagnostic_roots+=("$root")
            fi
          done
          if (( ${#diagnostic_roots[@]} == 0 )); then
            echo "MOD toolchain diagnostic directories were not created"
            exit 0
          fi

          mapfile -d '' build_logs < <(find "${diagnostic_roots[@]}" -type f -name build.log -print0)
          if (( ${#build_logs[@]} == 0 )); then
            echo "No crosstool-NG build.log found in MOD toolchain directories"
          fi
          shown=0
          for build_log in "${build_logs[@]}"; do
            if (( shown >= 3 )); then break; fi
            echo "Error-oriented tail of crosstool-NG $(basename "$build_log") (last 200 lines inspected):"
            # Avoid raw command/environment dumps and lines likely to contain
            # credentials; print at most 40 relevant lines per log.
            tail -n 200 "$build_log" \
              | grep -Ei 'tar:|xz:|fatal error:|error:|failed|corrupt|unexpected|file format|no such file' \
              | grep -Eiv 'token|password|secret|credential|authorization|api[_-]?key|https?://|@' \
              | tail -n 40 || true
            shown=$((shown + 1))
          done

          mapfile -d '' archives < <(find "${diagnostic_roots[@]}" -type f -name 'gcc-linaro-7.5-2019.12.tar.xz' -print0)
          if (( ${#archives[@]} == 0 )); then
            echo "GCC Linaro source archive not present for integrity diagnosis"
          fi
          checked=0
          for archive in "${archives[@]}"; do
            if (( checked >= 3 )); then break; fi
            echo "Checking downloaded $(basename "$archive") integrity"
            if xz -t -- "$archive"; then
              echo "XZ stream integrity: PASS"
              if tar -tJf "$archive" >/dev/null 2>&1; then
                echo "Tar member listing: PASS"
              else
                echo "Tar member listing: FAIL (bad or unsupported archive)"
              fi
            else
              echo "XZ stream integrity: FAIL (truncated or non-XZ content)"
            fi
            checked=$((checked + 1))
          done
          exit 0
      - name: Build for modaudio
        run: |
          make HEADLESS=true ${{ matrix.name }}-features
          make HEADLESS=true ${{ matrix.extraflags }} ${{ matrix.name }} -j $(nproc)
      - name: Set sha8
        id: slug
        run: echo "SHA8=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_ENV
      - name: Pack binaries
        run: |
          tar -c -h --hard-dereference -z -f ${{ github.event.repository.name }}-${{ matrix.name }}-${{ github.event.pull_request.number || env.SHA8 }}.tar.gz -C bin $(ls bin | grep lv2)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.name }}-${{ github.event.pull_request.number || env.SHA8 }}
          path: |
            *.tar.gz

  wasm:
    # Release uploads need write access; all other jobs stay read-only.
    permissions:
      contents: write
    strategy:
      matrix:
        target: [simd, nosimd]
    runs-on: ubuntu-22.04
    steps:
      - name: Verify SpeexDSP Git mirror before recursive checkout
        shell: bash
        run: |
          resolved="$(git ls-remote --get-url https://gitlab.xiph.org/xiph/speexdsp.git)"
          if [ "$resolved" != "https://github.com/xiph/speexdsp.git" ]; then
            echo "Expected official Xiph GitHub mirror, got: $resolved" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Complete pinned recursive submodule checkout (retry)
        shell: bash
        run: bash tools/ci/update_pinned_submodules.sh
      - name: Set up cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/PawPawBuilds
            src/Rack/dep/bin
            src/Rack/dep/include
            src/Rack/dep/lib
            src/Rack/dep/share
            src/Rack/dep/jansson-2.12
            src/Rack/dep/libarchive-3.4.3
            src/Rack/dep/libsamplerate-0.1.9
            src/Rack/dep/zstd-1.4.5
          key: wasm-${{ matrix.target }}-v${{ env.CACHE_VERSION }}
      - name: Set up dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq brotli gperf meson
          sudo apt-get clean
      - name: Build extra dependencies
        run: |
          ${{ matrix.target == 'nosimd' }} && export PAWPAW_NOSIMD=1
          bash .github/workflows/scripts/seed-pawpaw-flac.sh
          ./deps/PawPaw/bootstrap-cardinal.sh wasm && ./deps/PawPaw/.cleanup.sh wasm
      - name: Build wasm cross-compiled
        shell: bash
        run: |
          ${{ matrix.target == 'nosimd' }} && export PAWPAW_NOSIMD=1
          source deps/PawPaw/local.env wasm
          # FIXME send patch upstream, assuming this works..
          sed -i -e 's/defined(__riscv)/defined(__riscv) || defined(__EMSCRIPTEN__)/' plugins/surgext/surge/src/common/globals.h
          make features
          make HAVE_LIBLO=false NOOPT=true NOSIMD=${{ matrix.target == 'nosimd' }} -j $(nproc)
      - name: Build modgui
        shell: bash
        run: |
          ${{ matrix.target == 'nosimd' }} && export PAWPAW_NOSIMD=1
          source deps/PawPaw/local.env wasm
          make HAVE_LIBLO=false NOOPT=true NOSIMD=${{ matrix.target == 'nosimd' }} -j $(nproc) modgui
      - name: Make wasm versioned and compress
        shell: bash
        run: |
          ${{ matrix.target == 'nosimd' }} && export SUFFIX="-nosimd"
          VERSION=$(cat Makefile | awk 'sub("VERSION = ","")')
          cd bin
          sed -i "s/CardinalMini\./CardinalMini-v${VERSION}\./g" *.html *.js
          sed -i "s/CardinalNative\./CardinalNative-v${VERSION}\./g" *.html *.js
          sed -i "s/CardinalMini-nosimd\./CardinalMini-nosimd-v${VERSION}\./g" *.html *.js
          sed -i "s/CardinalNative-nosimd\./CardinalNative-nosimd-v${VERSION}\./g" *.html *.js
          mv CardinalMini.data   CardinalMini${SUFFIX}-v${VERSION}.data
          mv CardinalMini.js     CardinalMini${SUFFIX}-v${VERSION}.js
          mv CardinalMini.wasm   CardinalMini${SUFFIX}-v${VERSION}.wasm
          mv CardinalNative.data CardinalNative${SUFFIX}-v${VERSION}.data
          mv CardinalNative.js   CardinalNative${SUFFIX}-v${VERSION}.js
          mv CardinalNative.wasm CardinalNative${SUFFIX}-v${VERSION}.wasm
          brotli -k -q 11 *.data *.html *.js *.wasm
      - name: Set sha8 (non-release)
        if: startsWith(github.ref, 'refs/tags/') != true
        run: echo "SHA8=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_ENV
      - name: Set sha8 (release)
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "SHA8=$(echo ${{ github.ref_name }})" >> $GITHUB_ENV
      - name: Pack binaries
        run: |
          cd bin; zip -r -9 ../${{ github.event.repository.name }}-wasm-${{ matrix.target }}-${{ github.event.pull_request.number || env.SHA8 }}.zip $(ls *.br *.html *.data *.js *.wasm) CardinalMini.lv2/modgui
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-wasm-${{ matrix.target }}-${{ github.event.pull_request.number || env.SHA8 }}
          path: |
            *.zip
          if-no-files-found: ${{ startsWith(github.ref, 'refs/tags/') && 'error' || 'warn' }}
      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            *.zip

  windows:
    # Release uploads need write access; all other jobs stay read-only.
    permissions:
      contents: write
    strategy:
      matrix:
        target: [win32, win64]
    # Temporary host-runner pin for the Wine-based Windows cross-build.
    # ubuntu-latest moved to Ubuntu 26.04 with Docker 29.4.2; that version's
    # default seccomp profile breaks 32-bit Wine socketcall, causing
    # `wine: socket : Function not implemented` during required LV2 TTL
    # generation. Ubuntu 24.04 currently provides Docker 28.0.4 instead.
    # Keep the default seccomp isolation and the real metadata-generation gate.
    # Revisit when the Ubuntu 26.04 runner upgrades to a fixed Docker engine.
    # https://docs.docker.com/engine/release-notes/29/#2942
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    steps:
      - name: Install git
        run: |
          apt-get update -qq && apt-get install -yqq --no-install-recommends ca-certificates git openssl
      - name: Verify SpeexDSP Git mirror before recursive checkout
        shell: bash
        run: |
          resolved="$(git ls-remote --get-url https://gitlab.xiph.org/xiph/speexdsp.git)"
          if [ "$resolved" != "https://github.com/xiph/speexdsp.git" ]; then
            echo "Expected official Xiph GitHub mirror, got: $resolved" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Complete pinned recursive submodule checkout (retry)
        shell: bash
        run: bash tools/ci/update_pinned_submodules.sh
      - name: Set up cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/PawPawBuilds
            src/Rack/dep/bin
            src/Rack/dep/include
            src/Rack/dep/lib
            src/Rack/dep/share
            src/Rack/dep/jansson-2.12
            src/Rack/dep/libarchive-3.4.3
            src/Rack/dep/libsamplerate-0.1.9
            src/Rack/dep/zstd-1.4.5
          key: ${{ matrix.target }}-v${{ env.CACHE_VERSION }}
      - name: Set up dependencies
        run: |
          ./deps/PawPaw/.github/workflows/bootstrap-deps.sh ${{ matrix.target }}
          apt-get install -yqq wget xvfb zip
          apt-get clean
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ matrix.target }}-v${{ env.CACHE_VERSION }}
      - name: Build extra dependencies
        run: |
          bash .github/workflows/scripts/seed-pawpaw-flac.sh
          ./deps/PawPaw/bootstrap-cardinal.sh ${{ matrix.target }} && ./deps/PawPaw/.cleanup.sh ${{ matrix.target }}
      - name: Build cross-compiled (base)
        shell: bash
        run: |
          export PATH="/usr/lib/ccache:${PATH}"
          source deps/PawPaw/local.env ${{ matrix.target }}
          make features
          xvfb-run make NOOPT=true -j $(nproc)
      - name: Build cross-compiled (carla)
        shell: bash
        run: |
          export PATH="/usr/lib/ccache:${PATH}"
          source deps/PawPaw/local.env ${{ matrix.target }}
          make carla-win32 -j $(nproc)
          make -C carla EMBED_TARGET=true TESTING=true dist
          make -C carla EMBED_TARGET=true TESTING=true dist
      - name: Build cross-compiled (packaging)
        shell: bash
        run: |
          source deps/PawPaw/local.env ${{ matrix.target }}
          xvfb-run ./utils/create-windows-installer.sh ${{ matrix.target }}
          make unzipfx
      - name: Set sha8 (non-release)
        if: startsWith(github.ref, 'refs/tags/') != true
        run: echo "SHA8=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_ENV
      - name: Set sha8 (release)
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "SHA8=$(echo ${{ github.ref_name }})" >> $GITHUB_ENV
      - name: Pack binaries
        shell: bash
        run: |
          pushd bin
          zip -r -9 ../${{ github.event.repository.name }}-${{ matrix.target }}-${{ github.event.pull_request.number || env.SHA8 }}.zip $(ls | grep -e lv2 -e vst -e clap)
          popd
          zip -u -9 ${{ github.event.repository.name }}-${{ matrix.target }}-${{ github.event.pull_request.number || env.SHA8 }}.zip LICENSE README.md docs/*.* CardinalJACK.exe CardinalNative.exe
      # A successful non-release build must verify its uploaded Windows payload
      # just as a tag does. The slug is SHA8 on main and ref_name on tags.
      - name: Verify Windows installer and ZIP before every upload
        shell: bash
        run: |
          bash .github/workflows/scripts/verify-windows-release-artifacts.sh \
            "${{ github.event.repository.name }}" \
            "${{ matrix.target }}" \
            "${{ github.event.pull_request.number || env.SHA8 }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.target }}-${{ github.event.pull_request.number || env.SHA8 }}
          path: |
            Cardinal-${{ matrix.target }}-*-installer.exe
            ${{ github.event.repository.name }}-${{ matrix.target }}-*.zip
          if-no-files-found: ${{ startsWith(github.ref, 'refs/tags/') && 'error' || 'warn' }}
      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            Cardinal-${{ matrix.target }}-*-installer.exe
            ${{ github.event.repository.name }}-${{ matrix.target }}-*.zip

