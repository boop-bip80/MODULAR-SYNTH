name: Source quality baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate manifests, patches, and Git submodules
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
