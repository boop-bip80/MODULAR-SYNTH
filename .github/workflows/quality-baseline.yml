name: Source quality baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Recheck the newest commit on a PR or main; older source-only checks are stale.
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate manifests, patches, and Git submodules
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test Module Forge scaffolder
        run: python3 -m unittest discover -s tools/module-forge -p 'test_*.py' -v

      - name: Compile and run all standalone DSP tests (three optimization profiles)
        run: python3 -B tests/run_dsp_tests.py
