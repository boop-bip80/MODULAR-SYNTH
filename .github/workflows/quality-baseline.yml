name: Source quality baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate manifests, patches, and Git submodules
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test Module Forge scaffolder
        run: python3 -m unittest discover -s tools/module-forge -p 'test_*.py' -v

      - name: Compile and run Morph VCO standalone DSP smoke
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror tests/morphvco_dsp_smoke.cpp -o /tmp/morphvco_dsp_smoke
          /tmp/morphvco_dsp_smoke
